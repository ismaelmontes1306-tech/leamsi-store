<!DOCTYPE html>
<html lang="es-PE">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leamsi Store · Polo Nautica a S/40</title>
<link rel="preconnect" href="https://googleapis.com">
<link rel="preconnect" href="https://gstatic.com" crossorigin>
<link href="https://googleapis.com/css2?family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --paper: #F4EFE3;
    --paper-2: #ECE4D2;
    --ink: #171A1F;
    --navy: #1C2438;
    --orange: #FF5A2E;
    --mustard: #F2B23D;
    --muted: #6E6858;
    --line: rgba(23,26,31,0.14);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{
    background: var(--paper);
    color: var(--ink);
    font-family:'Inter', sans-serif;
    line-height:1.55;
    overflow-x:hidden;
  }
  h1,h2,h3,.display{
    font-family:'Anton', sans-serif;
    font-weight:400;
    letter-spacing:0.01em;
    text-transform:uppercase;
    line-height:0.95;
  }
  .mono{ font-family:'Space Mono', monospace; }
  a{ color:inherit; text-decoration:none; }
  img{ max-width:100%; display:block; }
  .wrap{ max-width: 1160px; margin:0 auto; padding:0 26px; }

  .bg-dots{
    position:fixed; inset:0; z-index:0; pointer-events:none;
    background-image: radial-gradient(var(--ink) 1px, transparent 1px);
    background-size: 26px 26px;
    opacity:0.05;
  }

  header{
    position:sticky; top:0; z-index:50;
    background: rgba(244,239,227,0.9);
    backdrop-filter: blur(10px);
    border-bottom: 3px solid var(--ink);
  }
  .marquee{
    background: var(--ink);
    color: var(--paper);
    overflow:hidden;
    white-space:nowrap;
    padding: 7px 0;
  }
  .marquee-track{
    display:inline-block;
    animation: scroll 18s linear infinite;
    font-family:'Space Mono', monospace;
    font-size: 0.76rem;
    letter-spacing: 0.08em;
  }
  .marquee-track span{ margin: 0 22px; }
  @keyframes scroll{ from{transform:translateX(0);} to{transform:translateX(-50%);} }

  nav{
    display:flex; align-items:center; justify-content:space-between;
    padding: 16px 26px;
    max-width:1160px; margin:0 auto;
  }
  .logo{
    font-family:'Anton'; font-size:1.5rem; letter-spacing:0.02em;
  }
  .logo em{ font-style:normal; color: var(--orange); }
  .nav-links{ display:flex; gap:30px; font-size:0.85rem; font-weight:600; text-transform:uppercase; letter-spacing:0.03em; }
  @media (max-width:760px){ .nav-links{display:none;} }
  .nav-cta{
    display:flex; align-items:center; gap:8px;
    background: var(--ink); color: var(--paper);
    font-weight:700; font-size:0.82rem; text-transform:uppercase; letter-spacing:0.03em;
    padding: 11px 18px; border-radius: 3px;
    transition: background .15s ease, transform .15s ease;
  }
  .nav-cta:hover{ background: var(--orange); transform: translateY(-1px); }

  .hero{ padding: 60px 0 40px; position:relative; }
  .hero-grid{
    display:grid; grid-template-columns: 0.95fr 1.05fr; gap:50px; align-items:center;
  }
  @media (max-width:940px){ .hero-grid{ grid-template-columns:1fr; } }

  .product-frame{
    position:relative;
    background: var(--paper-2);
    border: 3px solid var(--ink);
    border-radius: 6px;
    padding: 30px;
    overflow:visible;
  }
  .product-frame img{
    width:100%;
    mix-blend-mode: multiply;
  }
  .tag{
    position:absolute;
    top: -24px; right: -18px;
    background: var(--orange);
    color: var(--paper);
    border: 3px solid var(--ink);
    border-radius: 8px;
    padding: 14px 18px 16px;
    transform: rotate(8deg);
    text-align:center;
    box-shadow: 6px 6px 0 var(--ink);
  }
  .tag::before{
    content:"";
    position:absolute;
    top: -9px; left: 50%; transform: translateX(-50%);
    width: 12px; height:12px;
    background: var(--paper);
    border: 3px solid var(--ink);
    border-radius:50%;
  }
  .tag .price-label{ font-family:'Space Mono'; font-size:0.66rem; letter-spacing:0.1em; }
  .tag .price{ font-family:'Anton'; font-size:2.1rem; line-height:1; }
  .tag .price <sup>{ font-size:1rem; }</sup>

  .stock-pill{
    position:absolute; bottom: 18px; left: 18px;
    background: var(--ink); color: var(--paper);
    font-family:'Space Mono'; font-size:0.7rem;
    padding: 7px 12px; border-radius: 999px;
    display:flex; align-items:center; gap:8px;
  }
  .pulse-dot{ width:7px; height:7px; border-radius:50%; background: #5CE65C; box-shadow:0 0 8px #5CE65C; animation: blink 1.6s infinite; }
  @keyframes blink{ 50%{ opacity:0.3; } }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-family:'Space Mono'; font-size:0.74rem;
    letter-spacing:0.08em; text-transform:uppercase;
    border:2px solid var(--ink); padding:6px 12px; border-radius:999px;
    margin-bottom:22px;
  }
  .eyebrow .dot{ width:6px; height:6px; border-radius:50%; background: var(--orange); }

  .hero h1{ font-size: clamp(2.6rem, 5.4vw, 4.4rem); }
  .hero h1 .accent{ color: var(--orange); -webkit-text-stroke: 0; }
  .hero p.lead{
    margin-top:20px; font-size:1.05rem; color: var(--muted); max-width: 460px;
  }

  .size-row{ margin-top: 30px; }
  .size-row .label{ font-family:'Space Mono'; font-size:0.76rem; text-transform:uppercase; letter-spacing:0.06em; color: var(--muted); margin-bottom:10px; display:block; }
  .sizes{ display:flex; gap:10px; flex-wrap:wrap; }
  .size-chip{
    width:46px; height:46px;
    border:2px solid var(--ink); border-radius:6px;
    display:flex; align-items:center; justify-content:center;
    font-family:'Space Mono'; font-weight:700; font-size:0.85rem;
    cursor:pointer; background: var(--paper);
    transition: background .15s ease, color .15s ease, transform .15s ease;
  }
  .size-chip:hover{ transform: translateY(-2px); }
  .size-chip.active{ background: var(--ink); color: var(--paper); }

  .hero-actions{ display:flex; gap:14px; margin-top:32px; flex-wrap:wrap; }
  .btn-primary{
    display:inline-flex; align-items:center; gap:10px;
    background:#25D366; color:#06170c;
    font-weight:800; padding:16px 26px; border-radius:6px;
    border: 3px solid var(--ink);
    font-size:1rem; text-transform:uppercase; letter-spacing:0.02em;
    box-shadow: 5px 5px 0 var(--ink);
    transition: transform .12s ease, box-shadow .12s ease;
  }
  .btn-primary:hover{ transform: translate(-2px,-2px); box-shadow: 7px 7px 0 var(--ink); }
  .btn-secondary{
    display:inline-flex; align-items:center; gap:8px;
    border: 2px solid var(--ink); color: var(--ink);
    padding:15px 20px; border-radius:6px; font-size:0.92rem; font-weight:600;
    transition: background .15s ease;
  }
  .btn-secondary:hover{ background: rgba(23,26,31,0.06); }

  .mini-trust{ display:flex; gap:26px; margin-top:36px; flex-wrap:wrap; }
  .mini-trust div{ font-size:0.8rem; color: var(--muted); }
  .mini-trust b{ display:block; font-family:'Anton'; font-size:1.3rem; color: var(--ink); }

  section{ position:relative; padding: 70px 0; }
  .section-head{ max-width:600px; margin-bottom:44px; }
  .section-head h2{ font-size: clamp(1.9rem, 3.6vw, 2.7rem); }
  .section-head p{ color: var(--muted); margin-top:14px; }

  .why-grid{ display:grid; grid-template-columns: repeat(3,1fr); gap:20px; }
  @media (max-width:880px){ .why-grid{grid-template-columns:1fr 1fr;} }
  @media (max-width:600px){ .why-grid{grid-template-columns:1fr;} }
  .why-card{
    background: var(--paper-2);
    border: 2px solid var(--ink);
    border-radius:6px;
    padding: 24px 22px;
  }
  .why-num{ font-family:'Space Mono'; font-size:0.75rem; color: var(--orange); display:block; margin-bottom:12px; }
  .why-card h3{ font-family:'Inter'; font-weight:800; font-size:1rem; text-transform:none; margin-bottom:8px; letter-spacing:0; }
  .why-card p{ color: var(--muted); font-size:0.9rem; }

  .details-strip{
    border: 2px solid var(--ink); border-radius:6px;
    display:grid; grid-template-columns: repeat(4,1fr);
    overflow:hidden;
  }
  @media (max-width: 760px){ .details-strip{ grid-template-columns:1fr 1fr; } }
  .detail-cell{
    padding: 24px 20px;
    border-right: 2px solid var(--ink);
    background: var(--paper-2);
  }
  .detail-cell:last-child{ border-right:0; }
  @media (max-width: 760px){
    .detail-cell:nth-child(2){ border-right:0; }
    .detail-cell:nth-child(1), .detail-cell:nth-child(2){ border-bottom: 2px solid var(--ink); }
  }
  .detail-cell .label{ font-family:'Space Mono'; font-size:0.7rem; text-transform:uppercase; color: var(--muted); display:block; margin-bottom:4px; }
  .detail-cell .val{ font-weight:700; font-size:0.95rem; }

  footer{
    background: var(--ink); color: var(--paper);
    padding: 40px 0; text-align:center;
    font-size:0.8rem; font-family:'Space Mono';
    opacity:0.95; margin-top:40px;
    border-top: 4px solid var(--orange);
  }
</style>
</head>
<body>
<div class="bg-dots"></div>
<header>
  <div class="marquee">
    <div class="marquee-track">
      <span>⚡ ENVÍOS A TODO EL PERÚ</span>
      <span>• STOCK LIMITADO</span>
      <span>• PEDIDOS DIRECTOS POR WHATSAPP</span>
      <span>⚡ ENVÍOS A TODO EL PERÚ</span>
      <span>• STOCK LIMITADO</span>
      <span>• PEDIDOS DIRECTOS POR WHATSAPP</span>
    </div>
  </div>
  <nav>
    <div class="logo">LEAMSI<em>.STORE</em></div>
    <div class="nav-links">
      <a href="#detalles">Detalles</a>
      <a href="#garantia">Garantía</a>
    </div>
    <a href="https://wa.me" target="_blank" class="nav-cta">Contacto</a>
  </nav>
</header>

<main class="wrap">
  <section class="hero">
    <div class="hero-grid">
      <div class="product-frame">
        <div class="tag">
          <div class="price-label">OFERTA</div>
          <div class="price">S/40</div>
        </div>
        <img src="https://unsplash.com" alt="Polo Nautica">
        <div class="stock-pill">
